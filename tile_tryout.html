<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>タイル試し置き場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<style>
/* 作業台の形：左に「地図（ゲームの1画面分）」、右に「道具・タイル・ガイド」。狭い画面では上下に積む。
   色はゲームの32色パレットから取る。 */
:root{
  --bg:#e6ebee; --panel:#f7f8f9; --fg:#332222; --muted:#5d6a78; --line:#cbc6be;
  --accent:#32488a; --accent-fg:#eeeeee; --grass:#69ad46; --warn:#d0004f; --warn-bg:#fbe3ea; --ok:#21774f;
  --checker-a:#d9dee2; --checker-b:#cfd5da;
  --font-display:"DotGothic16","M PLUS Rounded 1c",system-ui,sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;
  --radius:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141d33; --panel:#1c2a4a; --fg:#eeeeee; --muted:#a9b6c2; --line:#34466e;
  --accent:#aacfda; --accent-fg:#1c2a4a; --grass:#b5d65a; --warn:#ec8788; --warn-bg:#3a2433; --ok:#b5d65a;
  --checker-a:#22304f; --checker-b:#1b2742; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141d33; --panel:#1c2a4a; --fg:#eeeeee; --muted:#a9b6c2; --line:#34466e;
  --accent:#aacfda; --accent-fg:#1c2a4a; --grass:#b5d65a; --warn:#ec8788; --warn-bg:#3a2433; --ok:#b5d65a;
  --checker-a:#22304f; --checker-b:#1b2742; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font-family:var(--font-display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.04em}
header p{margin:0;color:var(--muted);font-size:.9rem}
h2{font-family:var(--font-display);font-weight:400;font-size:1.15rem;margin:0;letter-spacing:.03em}
h3{font-size:.95rem;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1440px){.layout{grid-template-columns:minmax(0,1fr) 420px}}
.wrap{max-width:1500px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mapbox{width:max-content;max-width:100%;overflow:auto;border-radius:4px;background:repeating-conic-gradient(var(--checker-a) 0 25%,var(--checker-b) 0 50%) 0 0/16px 16px;max-height:78vh}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#map{touch-action:none;cursor:crosshair}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
button,.filebtn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:var(--radius);padding:5px 10px;cursor:pointer;line-height:1.4}
button:hover,.filebtn:hover{border-color:var(--accent)}
button:focus-visible,.filebtn:focus-within,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.brush{display:inline-flex;align-items:center;gap:6px}
.swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.chip.bad{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chip.good{color:var(--ok);border-color:var(--ok)}
label.check{display:inline-flex;align-items:center;gap:5px;font-size:.88rem;cursor:pointer}
select{font:inherit;font-size:.88rem;padding:4px 6px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 10px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);font-weight:700}
.sheet{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.sheet:first-child{border-top:none;padding-top:0}
.sheethead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.sheetview{overflow-x:auto}
.note{font-size:.85rem;color:var(--muted);margin:0}
.msg{font-size:.85rem;margin:0}
.msg.bad{color:var(--warn)}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn{position:relative;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.box{width:12px;height:12px;border:2px solid;border-radius:2px}
.guide p,.guide li{font-size:.9rem;max-width:65ch}
.guide ul{margin:0;padding-left:1.2em}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.slot{display:flex;gap:8px;align-items:center;font-size:.8rem;line-height:1.35;border:1px solid var(--line);border-radius:var(--radius);padding:6px;min-width:0}
.slot b{display:block;font-size:.82rem}
.slot.missing{border-color:var(--warn);background:var(--warn-bg)}
.palette{display:flex;flex-wrap:wrap;gap:4px}
.palette button{padding:2px;line-height:0}
.palette canvas{width:32px;height:32px}
.status{font-size:.85rem;color:var(--muted);min-height:1.5em;margin:0}
kbd{font-family:inherit;font-size:.8em;border:1px solid var(--line);border-radius:3px;padding:0 4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>タイル試し置き場</h1>
    <p>ちりちゃん／田舎町の工場ゲーム（仮）。ゲームと同じつなぎ方で、地面のタイルを並べて確かめる。</p>
  </header>

  <div class="layout">
    <section class="panel" aria-label="地図">
      <div class="row" role="toolbar" aria-label="塗る地形">
        <span class="label">塗る</span>
        <div class="row" id="brushes"></div>
      </div>
      <div class="row">
        <span class="label">表示</span>
        <select id="zoom" aria-label="表示の大きさ">
          <option value="fit" selected>画面に合わせる</option><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option><option value="4">×4（ゲームの最大ズーム）</option>
        </select>
        <label class="check"><input type="checkbox" id="optGrid">マス目</label>
        <label class="check"><input type="checkbox" id="optMissing" checked>足りないタイルに印</label>
        <label class="check"><input type="checkbox" id="optAnim" checked>アニメ</label>
        <label class="check"><input type="checkbox" id="optPlayer" checked>主人公</label>
      </div>
      <div class="mapbox" id="mapbox"><canvas id="map" width="480" height="272" aria-label="タイルを並べる地図。ゲームの1画面分（横30×縦17マス）"></canvas></div>
      <div class="row" style="justify-content:space-between">
        <div class="row" id="summary"></div>
        <div class="row">
          <button type="button" id="btnSample">見本の地図に戻す</button>
          <button type="button" id="btnClear">草だけにする</button>
          <button type="button" id="btnShot">画像で保存</button>
        </div>
      </div>
      <p class="status" id="hover" aria-live="polite">マスに触れると、そのマスに使われるタイルが出ます。</p>
    </section>

    <aside class="panel" aria-label="タイルとガイド">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-sheets" aria-selected="true" aria-controls="pane-sheets">タイルシート</button>
        <button type="button" role="tab" id="tab-guide" aria-selected="false" aria-controls="pane-guide">ガイド</button>
        <button type="button" role="tab" id="tab-cliff" aria-selected="false" aria-controls="pane-cliff">崖</button>
      </div>

      <div id="pane-sheets" role="tabpanel" aria-labelledby="tab-sheets">
        <div class="legend" style="margin-bottom:10px">
          <span><i class="box" style="border-color:var(--ok)"></i>地図で使っている</span>
          <span><i class="box" style="border-color:var(--warn)"></i>使う場所なのに空っぽ</span>
          <span><i class="box" style="border-color:var(--muted);border-style:dashed"></i>使わない</span>
        </div>
        <div id="sheets" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>

      <div id="pane-guide" role="tabpanel" aria-labelledby="tab-guide" class="guide" hidden></div>

      <div id="pane-cliff" role="tabpanel" aria-labelledby="tab-cliff" class="guide" hidden></div>
    </aside>
  </div>
</div>

// ---------- 画像 ----------
function loadImage(src){ return new Promise((ok,ng)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ng; i.src=src; }); }
function emptyCells(img, cols, rows){
  const c=document.createElement("canvas"); c.width=img.width; c.height=img.height;
  const g=c.getContext("2d"); g.drawImage(img,0,0);
  const set=new Set();
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    if(x*T>=img.width||y*T>=img.height){ set.add(x+","+y); continue; }
    const d=g.getImageData(x*T,y*T,T,T).data; let any=false;
    for(let i=3;i<d.length;i+=4) if(d[i]>0){ any=true; break; }
    if(!any) set.add(x+","+y);
  }
  return set;
}

// ---------- 地図の状態 ----------
// 四隅の格子（31×18）。地面のタイルは、マスの四隅がどの地形かで決まる（Godot のテレイン「角を合わせる」と同じ）。
const corners = new Uint8Array((W+1)*(H+1));
let cliffs = {};   // "x,y" -> [col,row]（崖シートのどのマスか）
const ci=(x,y)=>y*(W+1)+x;
function paintCell(x,y,t){ for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]]) corners[ci(x+dx,y+dy)]=t; }
function fillCells(t,x0,y0,x1,y1){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(x>=0&&y>=0&&x<W&&y<H) paintCell(x,y,t); }
function sampleMap(){
  corners.fill(GRASS); cliffs={};
  fillCells(1,2,0,4,6); fillCells(1,2,6,7,8); fillCells(1,5,8,7,16);      // 曲がる川
  fillCells(1,23,2,26,4);                                                 // 池
  fillCells(2,10,3,15,4); fillCells(2,14,3,15,7);                         // 干からびた水路
  fillCells(3,10,10,29,11); fillCells(3,19,6,20,10);                      // 道（T字）
  fillCells(4,24,14,29,16); fillCells(4,21,15,23,16);                     // 山
  placePlateau(9,13,4,2,2);
}
function cellCorners(x,y){ return [corners[ci(x,y)],corners[ci(x+1,y)],corners[ci(x,y+1)],corners[ci(x+1,y+1)]]; }
function hash(x,y,s){ let h=(x*374761393+y*668265263+s*982451653)>>>0; h=(h^(h>>>13))*1274126177>>>0; return (h^(h>>>16))>>>0; }

// マスに使うタイルを決める
function resolve(x,y){
  const c=cellCorners(x,y);
  const kinds=[...new Set(c.filter(v=>v!==GRASS))];
  if(kinds.length===0) return {type:"grass", tuft: hash(x,y,1)%10===0};
  if(kinds.length>1) return {type:"mix", kinds};
  const t=TERRAIN_BY_ID[kinds[0]];
  const mask=(c[0]===t.id?TL:0)|(c[1]===t.id?TR:0)|(c[2]===t.id?BL:0)|(c[3]===t.id?BR:0);
  const cands=t.slots.filter(s=>s[2]===mask && !t.empty.has(s[0]+","+s[1]));
  if(!cands.length) return {type:"missing", t, mask, defined:t.slots.some(s=>s[2]===mask)};
  let slot=cands[0];
  if(cands.length>1){ const total=cands.reduce((a,s)=>a+(s[3]||1),0); let r=hash(x,y,7)%total; for(const s of cands){ r-=(s[3]||1); if(r<0){ slot=s; break; } } }
  return {type:"tile", t, mask, slot};
}

const map=document.getElementById("map"), g=map.getContext("2d");
g.imageSmoothingEnabled=false;
const zoomSel=document.getElementById("zoom");
const opt={grid:document.getElementById("optGrid"),missing:document.getElementById("optMissing"),anim:document.getElementById("optAnim"),player:document.getElementById("optPlayer")};
let IMG={}, frameClock=0;
function applyZoom(){
  let z=zoomSel.value;
  if(z==="fit"){ const w=document.getElementById("mapbox").parentElement.clientWidth-28; z=Math.max(1,Math.min(4,Math.floor(w/480))); }
  z=+z; map.style.width=(480*z)+"px"; map.style.height=(272*z)+"px";
}
window.addEventListener("resize",()=>{ if(zoomSel.value==="fit") applyZoom(); });

function drawTileFrom(img,col,row,x,y){ g.drawImage(img,col*T,row*T,T,T,x*T,y*T,T,T); }
function draw(){
  const now=performance.now()/1000;
  g.clearRect(0,0,map.width,map.height);
  const used={}; let missing=0, mix=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const r=resolve(x,y);
    if(r.type==="grass"){ g.drawImage(r.tuft?IMG.tuft:IMG.grass,x*T,y*T); continue; }
    if(r.type==="tile"){
      let col=r.slot[0];
      const a=r.t.anim;
      if(a && a.frames>1 && r.mask===FULL && opt.anim.checked){
        const f=Math.floor(now*a.fps + (hash(x,y,3)%a.frames)) % a.frames; col=r.slot[0]+f;
      }
      drawTileFrom(IMG[r.t.key],col,r.slot[1],x,y);
      (used[r.t.key]??=new Set()).add(r.slot[0]+","+r.slot[1]);
      continue;
    }
    g.drawImage(IMG.grass,x*T,y*T);
    if(r.type==="missing") missing++; else mix++;
    if(opt.missing.checked){
      g.fillStyle = r.type==="missing" ? "rgba(240,0,96,.55)" : "rgba(255,228,32,.6)";
      g.fillRect(x*T+1,y*T+1,T-2,T-2);
      g.fillStyle="#332222"; g.font="bold 11px sans-serif"; g.textAlign="center"; g.textBaseline="middle";
      g.fillText(r.type==="missing"?"?":"×",x*T+8,y*T+9);
    }
  }
  // 崖（手で置く層）
  for(const k in cliffs){ const [x,y]=k.split(",").map(Number); const [c,r]=cliffs[k]; drawTileFrom(IMG.cliff,c,r,x,y); }
  if(opt.player.checked){
    const px=16*T, py=10*T;
    g.drawImage(IMG.shadow,px+2,py-4);
    g.drawImage(IMG.player,0,0,16,32,px,py-32,16,32);
  }
  if(opt.grid.checked){
    g.fillStyle="rgba(51,34,34,.18)";
    for(let x=1;x<W;x++) g.fillRect(x*T,0,1,272);
    for(let y=1;y<H;y++) g.fillRect(0,y*T,480,1);
  }
  lastUsed=used;
  renderSummary(missing,mix);
}
let lastUsed={}, lastSummary="";
function renderSummary(missing,mix){
  const key=missing+"/"+mix; if(key===lastSummary) return; lastSummary=key;
  const box=document.getElementById("summary"); box.textContent="";
  const mk=(cls,text)=>{ const s=document.createElement("span"); s.className="chip "+cls; s.textContent=text; box.appendChild(s); };
  if(!missing && !mix) mk("good","足りないタイルはありません");
  if(missing) mk("bad",`足りないタイル ${missing}マス（赤い ?）`);
  if(mix) mk("bad",`2種類の地形が触れている ${mix}マス（黄色い ×）`);
  updateSheetMarks();
}
function loop(){ draw(); requestAnimationFrame(loop); }

// ---------- 塗る ----------
const BRUSHES=[{id:0,name:"草",color:"#69ad46"},...TERRAINS.map(t=>({id:t.id,name:t.name.replace(/（.*）/,""),color:t.color})),{id:"cliff",name:"崖を置く",color:"#a7865a"},{id:"erase-cliff",name:"崖を消す",color:"transparent"}];
let brush=1;
function renderBrushes(){
  const box=document.getElementById("brushes"); box.textContent="";
  for(const b of BRUSHES){
    const btn=document.createElement("button"); btn.type="button"; btn.className="brush";
    btn.setAttribute("aria-pressed", String(brush===b.id));
    const sw=document.createElement("span"); sw.className="swatch"; sw.style.background=b.color; if(b.color==="transparent") sw.style.borderStyle="dashed";
    btn.append(sw, b.name);
    btn.onclick=()=>{ brush=b.id; renderBrushes(); if(b.id==="cliff") showTab("cliff"); };
    box.appendChild(btn);
  }
}
let painting=false;
function cellAt(ev){ const r=map.getBoundingClientRect(); const x=Math.floor((ev.clientX-r.left)/r.width*W); const y=Math.floor((ev.clientY-r.top)/r.height*H); return (x>=0&&y>=0&&x<W&&y<H)?[x,y]:null; }
function applyBrush(c){
  const [x,y]=c;
  if(brush==="cliff"){ cliffs[x+","+y]=cliffPick.slice(); }
  else if(brush==="erase-cliff"){ delete cliffs[x+","+y]; }
  else paintCell(x,y,brush);
}
map.addEventListener("pointerdown",ev=>{ const c=cellAt(ev); if(!c) return; painting=true; map.setPointerCapture(ev.pointerId); applyBrush(c); describe(c); });
map.addEventListener("pointermove",ev=>{ const c=cellAt(ev); if(c) describe(c); if(painting&&c) applyBrush(c); });
const stop=()=>{ if(painting){ painting=false; saveStore(); setTimeout(updateSheetMarks,50); } };
map.addEventListener("pointerup",stop); map.addEventListener("pointercancel",stop);

function describe([x,y]){
  const r=resolve(x,y), el=document.getElementById("hover");
  const where=`横${x+1}・縦${y+1}マス目：`;
  if(r.type==="grass") el.textContent=where+"草"+(r.tuft?"（草むら）":"");
  else if(r.type==="tile") el.textContent=where+`${r.t.name}の「${PART[r.mask].name}」（シートの左から${r.slot[0]+1}・上から${r.slot[1]+1}枚目）`;
  else if(r.type==="missing") el.textContent=where+`${r.t.name}の「${PART[r.mask].name}」が${r.defined?"シートで空っぽ":"シートにありません"}。${PART[r.mask].use}。`;
  else el.textContent=where+r.kinds.map(k=>TERRAIN_BY_ID[k].name).join("と")+"が1マスの中で触れています。Godot にはこの組み合わせの絵がないので、間に草を1マスはさむか、つなぎの絵を相談する。";
  if(cliffs[x+","+y]){ const [c,rr]=cliffs[x+","+y]; el.textContent+=` ／ 崖：${CLIFF_PART[rr*3+c]||"崖"}`; }
}

// ---------- タイルシートの欄 ----------
function sheetCanvas(t){
  const s=4, [cols,rows]=t.size, c=document.createElement("canvas");
  c.width=cols*T*s; c.height=rows*T*s; c.style.width=(cols*T*s/1.333)+"px"; c.style.maxWidth="100%";
  c.dataset.key=t.key; return c;
}
function drawSheet(c,t){
  const s=4, x=c.getContext("2d"); x.imageSmoothingEnabled=false;
  x.clearRect(0,0,c.width,c.height);
  x.drawImage(IMG[t.key],0,0,IMG[t.key].width*s,IMG[t.key].height*s);
  const used=lastUsed[t.key]||new Set();
  const css=getComputedStyle(document.documentElement);
  const ok=css.getPropertyValue("--ok").trim(), warn=css.getPropertyValue("--warn").trim(), muted=css.getPropertyValue("--muted").trim();
  const [cols,rows]=t.size;
  const slotAt={}; for(const sl of t.slots) slotAt[sl[0]+","+sl[1]]=sl;
  for(let r=0;r<rows;r++) for(let col=0;col<cols;col++){
    const k=col+","+r, sl=slotAt[k];
    let color=null, dash=false;
    if(sl){ if(t.empty.has(k)) color=warn; else if(used.has(k)) color=ok; }
    else if(!(t.anim && t.slots.some(q=>q[1]===r && q[2]===FULL && col>q[0] && col<q[0]+t.anim.frames))){ color=muted; dash=true; }
    if(!color) continue;
    x.strokeStyle=color; x.lineWidth=4; x.setLineDash(dash?[6,6]:[]);
    x.strokeRect(col*T*s+3,r*T*s+3,T*s-6,T*s-6);
  }
  x.setLineDash([]);
}
function updateSheetMarks(){ document.querySelectorAll("#sheets canvas[data-key]").forEach(c=>drawSheet(c,TERRAIN_BY_ID[TERRAINS.find(t=>t.key===c.dataset.key).id])); }

function renderSheets(){
  const box=document.getElementById("sheets"); box.textContent="";
  for(const t of TERRAINS){
    const wrap=document.createElement("div"); wrap.className="sheet";
    const head=document.createElement("div"); head.className="sheethead";
    const h=document.createElement("h3"); const sw=document.createElement("span"); sw.className="swatch"; sw.style.cssText=`display:inline-block;vertical-align:-2px;margin-right:6px;background:${t.color}`;
    h.append(sw, t.name);
    const btns=document.createElement("div"); btns.className="row";
    const fb=document.createElement("label"); fb.className="filebtn"; fb.textContent="絵を読み込む";
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/png,image/*"; inp.id="file-"+t.key; fb.appendChild(inp);
    inp.onchange=()=>{ const f=inp.files[0]; if(f) readSheet(t,f,msg); inp.value=""; };
    btns.appendChild(fb);
    if(t.custom){ const rb=document.createElement("button"); rb.type="button"; rb.textContent="元に戻す"; rb.onclick=async()=>{ t.custom=null; await setSheet(t,ASSETS[t.key]); saveStore(); renderSheets(); }; btns.appendChild(rb); }
    const gb=document.createElement("button"); gb.type="button"; gb.textContent="下書き用ガイドを保存"; gb.onclick=()=>saveGuide(t,msg); btns.appendChild(gb);
    head.append(h,btns);
    const view=document.createElement("div"); view.className="sheetview";
    const c=sheetCanvas(t); view.appendChild(c);
    const msg=document.createElement("p"); msg.className="msg";
    const info=document.createElement("p"); info.className="note";
    const empties=t.slots.filter(s=>t.empty.has(s[0]+","+s[1])).length;
    info.textContent=`${t.size[0]*T}×${t.size[1]*T}ピクセル（${t.size[0]}×${t.size[1]}枚）。地面の種類は ${t.kind}。` + (empties?`空っぽの場所が${empties}か所。`:"") + (t.custom?"いまは読み込んだ絵で表示しています。":"いまはゲームに入っている絵です。");
    wrap.append(head,view,info);
    if(t.anim){
      const ar=document.createElement("div"); ar.className="row";
      const l1=document.createElement("label"); l1.className="check"; l1.textContent="まんなかのアニメ：コマ数";
      const fr=document.createElement("select"); fr.id="frames-"+t.key; [1,2,3,4].forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=n; if(n===t.anim.frames) o.selected=true; fr.appendChild(o); });
      const l2=document.createElement("label"); l2.className="check"; l2.textContent="1秒に";
      const fp=document.createElement("select"); fp.id="fps-"+t.key; [1,2,3,4,6].forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=n+"コマ"; if(n===t.anim.fps) o.selected=true; fp.appendChild(o); });
      fr.onchange=()=>{ t.anim.frames=+fr.value; saveStore(); };
      fp.onchange=()=>{ t.anim.fps=+fp.value; saveStore(); };
      l1.appendChild(fr); l2.appendChild(fp); ar.append(l1,l2);
      const an=document.createElement("p"); an.className="note"; an.textContent="アニメのコマは、まんなかの絵の右へ横に並べます（今の水は3コマ、1秒に2コマ。Godot の設定と同じ）。";
      wrap.append(ar,an);
    }
    wrap.appendChild(msg);
    box.appendChild(wrap);
    drawSheet(c,t);
  }
}
async function setSheet(t,src){
  const img=await loadImage(src); IMG[t.key]=img;
  t.empty=emptyCells(img,t.size[0],t.size[1]);
  return img;
}
function readSheet(t,file,msg){
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const img=await loadImage(fr.result);
      const ew=t.size[0]*T, eh=t.size[1]*T;
      t.custom=fr.result; await setSheet(t,fr.result); saveStore(); renderSheets();
      const m=document.querySelector(`#file-${t.key}`).closest(".sheet").querySelector(".msg");
      if(img.width!==ew||img.height!==eh){ m.className="msg bad"; m.textContent=`大きさが ${img.width}×${img.height} です。ゲームの並びは ${ew}×${eh}（16ピクセルのタイルが横${t.size[0]}・縦${t.size[1]}枚）なので、左上から合うところだけ使っています。`; }
      else { m.className="msg"; m.textContent=`読み込みました（${file.name}）。このブラウザにだけ残ります。`; }
    }catch(e){ msg.className="msg bad"; msg.textContent="画像として読めませんでした。PNG で書き出したファイルを選んでください。"; }
  };
  fr.readAsDataURL(file);
}

// ---------- 保存（downloads） ----------
let downloads=null;
(async()=>{ try{ downloads = window.claude ? await window.claude.use("downloads") : null; }catch(e){ downloads=null; } })();
async function offer(canvas,filename,msgEl){
  const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
  if(!downloads){
    // Claude の外（GitHub Pages など）では、ふつうのダウンロードにする
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    if(msgEl){ msgEl.className="msg"; msgEl.textContent=`${filename} を保存しました（ダウンロードフォルダを見てください）。`; }
    return;
  }
  try{ await downloads.save({filename, data:blob}); if(msgEl){ msgEl.className="msg"; msgEl.textContent=`${filename} を保存しました。`; } }
  catch(e){ if(msgEl && e && e.code!=="declined"){ msgEl.className="msg bad"; msgEl.textContent="保存できませんでした。少し待ってからもう一度押してください。"; } }
}

};
// 下書き用ガイド：シートと同じ並びを8倍に広げ、各マスに「四隅のどこが地形か」と名前を描く
function saveGuide(t,msgEl){
  const s=8, [cols,rows]=t.size, pad=24, cw=cols*T*s, ch=rows*T*s;
  const c=document.createElement("canvas"); c.width=cw+pad*2; c.height=ch+pad*2+40;
  const x=c.getContext("2d"); x.imageSmoothingEnabled=false;
  x.fillStyle="#ffffff"; x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#332222"; x.font="bold 18px sans-serif"; x.textBaseline="top";
  x.fillText(`${t.name}：${cols*T}×${rows*T}ピクセル（16×16 を横${cols}・縦${rows}枚）`,pad,10);
  x.save(); x.translate(pad,pad+30);
  x.globalAlpha=.35; x.drawImage(IMG[t.key],0,0,IMG[t.key].width*s,IMG[t.key].height*s); x.globalAlpha=1;
  const slotAt={}; for(const sl of t.slots) slotAt[sl[0]+","+sl[1]]=sl;
  for(let r=0;r<rows;r++) for(let col=0;col<cols;col++){
    const ox=col*T*s, oy=r*T*s, sl=slotAt[col+","+r];
    x.strokeStyle="#959595"; x.lineWidth=1; x.strokeRect(ox+.5,oy+.5,T*s-1,T*s-1);
    let label=null, mask=null;
    if(sl){ mask=sl[2]; label=PART[mask].name + (mask===FULL&&sl[3]>1?`（出やすさ${sl[3]}）`:""); }
    else if(t.anim && t.slots.some(q=>q[1]===r && q[2]===FULL && col>q[0] && col<q[0]+t.anim.frames)){ label=`アニメ ${col+1}コマ目`; mask=FULL; }
    if(label===null){ x.fillStyle="#959595"; x.font="14px sans-serif"; x.fillText("使わない",ox+8,oy+8); continue; }
    // 四隅の図
    const q=22, mx=ox+T*s-q*2-8, my=oy+8;
    [[TL,0,0],[TR,1,0],[BL,0,1],[BR,1,1]].forEach(([bit,dx,dy])=>{ x.fillStyle=(mask&bit)?t.color:"#69ad46"; x.fillRect(mx+dx*q,my+dy*q,q-2,q-2); });
    x.fillStyle="#332222"; x.font="bold 14px sans-serif";
    const words=label.match(/.{1,6}/g)||[label]; words.forEach((w,i)=>x.fillText(w,ox+8,oy+T*s-22-(words.length-1-i)*18));
  }
  x.restore();
  offer(c,`guide_${t.key}.png`,msgEl);
}

// ---------- ガイドの欄 ----------
function cornerIcon(mask,color){
  const c=document.createElement("canvas"); c.width=20; c.height=20; c.style.width="28px"; c.style.height="28px"; c.style.flex="none";
  const x=c.getContext("2d");
  [[TL,0,0],[TR,1,0],[BL,0,1],[BR,1,1]].forEach(([bit,dx,dy])=>{ x.fillStyle=(mask&bit)?color:"#69ad46"; x.fillRect(dx*10,dy*10,9,9); });
  return c;
}
function renderGuide(){
  const p=document.getElementById("pane-guide"); p.textContent="";
  const add=(tag,html)=>{ const e=document.createElement(tag); e.innerHTML=html; p.appendChild(e); return e; };
  add("h2","タイルのつながり方");
  add("p","Godot は、マスの<b>四隅</b>がそれぞれ「その地形」か「草」かを見て、使う絵を1枚選びます。だから地形1種類につき、四隅の組み合わせごとの絵がいります。下の図の青いところが地形、緑が草です。");
  add("p","1種類あたり<b>外かど4枚・ふち4枚・内かど4枚・まんなか1枚以上</b>の13枚で、ふつうの池・川・道は描けます。まんなかを数枚描くと、ばらついて自然に見えます（水はアニメのコマも横に並べる）。");
  const grid=document.createElement("div"); grid.className="slotgrid"; p.appendChild(grid);
  for(const m of [8,12,4,10,15,5,2,3,1,14,13,11,7,6,9]){
    const s=document.createElement("div"); s.className="slot"+((m===6||m===9)?" missing":"");
    const tx=document.createElement("div"); tx.innerHTML=`<b>${PART[m].name}</b>${PART[m].use}`;
    s.append(cornerIcon(m,"#4f8fc0"),tx); grid.appendChild(s);
  }
  add("h3","どこで、どの絵がいるか");
  add("ul",`<li><b>池</b>（四角いかたまり）：外かど4・ふち4・まんなか。内かどは使わない。</li>
  <li><b>曲がる川・曲がる道</b>：曲がるところの外側に外かど、内側に<b>内かど</b>がいる。</li>
  <li><b>T字・十字の道</b>：分かれ目の角に内かどがいる。道はT字が多いので内かど4枚は必ず。</li>
  <li><b>1マス幅の道や水路</b>：この仕組みでは、1マスを塗ると四隅が塗られるので、見た目は2マス近くの幅になる。細い道は2マス幅で描く前提にする。</li>
  <li><b>ななめの2枚</b>（赤い枠）：今のシートには無い。2つのかたまりが、ななめに1マスあけて並ぶと、間のマスに赤い「?」が出る。描いて足すか、地図でそう並べないように塗る。</li>
  <li><b>ちがう地形どうし</b>（水と道など）が1マスの中で触れると、Godot にはつなぎの絵がない。黄色い「×」が出るので、間に草を1マスはさむ。橋は別に置く。</li>`);
  add("h3","描くときの決まり");
  add("ul",`<li>1枚は16×16ピクセル。シートの並びは「タイルシート」の欄と同じにする（左上から）。</li>
  <li>背景は透明のPNGで、ファイル名は半角英小文字（例：water.png）。</li>
  <li>地面のタイルには縁取りを付けない。光は右上から。色は32色のパレットから。</li>
  <li>「下書き用ガイドを保存」で、並び・四隅の図・名前の入った8倍の見本画像が保存できる。アイビスペイントで下に敷いて描ける。</li>`);
}

// ---------- 崖 ----------
// 崖は当面「手で置く」（Godot では Ground とは別の TileMapLayer「Cliffs」）。下は四角い崖11枚の並びの案。
const CLIFF_PART=["ふち・左上","ふち・上","ふち・右上","ふち・左","（崖の上：草）","ふち・右","ふち・左下","ふち・下","ふち・右下","壁・左","壁・まんなか","壁・右"];
let cliffCustom=null, cliffPick=[1,0];
function makeCliffSheet(){
  // 仮の崖（四角と線だけ）。dora さんの絵を読み込むと置き換わる。
  const c=document.createElement("canvas"); c.width=3*T; c.height=4*T; const x=c.getContext("2d");
  const rim="#3f5a2e", top="#69ad46", wall="#8b633b", wallD="#5e4430", wallL="#a7865a";
  const px=(col,row,fn)=>{ x.save(); x.translate(col*T,row*T); fn(); x.restore(); };
  const grass=()=>{ x.fillStyle=top; x.fillRect(0,0,T,T); };
  // ふち（上の面のへり）
  px(0,0,()=>{ grass(); x.fillStyle=rim; x.fillRect(0,0,T,3); x.fillRect(0,0,3,T); for(let i=0;i<6;i++){ x.clearRect(0,i,6-i,1); } });
  px(1,0,()=>{ grass(); x.fillStyle=rim; x.fillRect(0,0,T,3); });
  px(2,0,()=>{ grass(); x.fillStyle=rim; x.fillRect(0,0,T,3); x.fillRect(T-3,0,3,T); for(let i=0;i<6;i++){ x.clearRect(T-6+i,i,6-i,1); } });
  px(0,1,()=>{ grass(); x.fillStyle=rim; x.fillRect(0,0,3,T); });
  px(1,1,()=>{ });
  px(2,1,()=>{ grass(); x.fillStyle=rim; x.fillRect(T-3,0,3,T); });
  px(0,2,()=>{ grass(); x.fillStyle=rim; x.fillRect(0,0,3,T); x.fillRect(0,T-3,T,3); });
  px(1,2,()=>{ grass(); x.fillStyle=rim; x.fillRect(0,T-3,T,3); });
  px(2,2,()=>{ grass(); x.fillStyle=rim; x.fillRect(T-3,0,3,T); x.fillRect(0,T-3,T,3); });
  // 壁（正面から見える土の面）
  const wallT=(edge)=>{ x.fillStyle=wall; x.fillRect(0,0,T,T); x.fillStyle=wallD; x.fillRect(0,5,T,1); x.fillRect(0,11,T,1); x.fillStyle=wallL; x.fillRect(0,0,T,1);
    if(edge==="L"){ x.fillStyle=wallD; x.fillRect(0,0,2,T); } if(edge==="R"){ x.fillStyle=wallD; x.fillRect(T-2,0,2,T); } };
  px(0,3,()=>wallT("L")); px(1,3,()=>wallT("M")); px(2,3,()=>wallT("R"));
  return c.toDataURL("image/png");
}
// 台地を置く：上の面 w×d マス＋正面の壁 h マス
function placePlateau(x0,y0,w,d,h){
  for(let j=0;j<d;j++) for(let i=0;i<w;i++){
    const col= i===0?0:(i===w-1?2:1), row= j===0?0:(j===d-1?2:1);
    if(row===1&&col===1) continue;
    cliffs[(x0+i)+","+(y0+j)]=[col,row];
  }
  for(let k=0;k<h;k++) for(let i=0;i<w;i++){ const col=i===0?0:(i===w-1?2:1); cliffs[(x0+i)+","+(y0+d+k)]=[col,3]; }
}
function renderCliff(){
  const p=document.getElementById("pane-cliff"); p.textContent="";
  const add=(tag,html)=>{ const e=document.createElement(tag); e.innerHTML=html; p.appendChild(e); return e; };
  add("h2","崖（手で置く）");
  add("p","崖は地面とは別の層に、手で1枚ずつ置きます。崖の壁とふちは歩けず、階段と坂は歩けます。下の絵を選んでから、地図をなぞって置いてください（「塗る」の「崖を置く」）。");
  const pal=document.createElement("div"); pal.className="palette"; p.appendChild(pal);
  const cols=Math.floor(IMG.cliff.width/T), rows=Math.floor(IMG.cliff.height/T);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const b=document.createElement("button"); b.type="button"; b.title=CLIFF_PART[r*3+c]||`左から${c+1}・上から${r+1}`;
    b.setAttribute("aria-label",b.title); b.setAttribute("aria-pressed",String(cliffPick[0]===c&&cliffPick[1]===r));
    const cv=document.createElement("canvas"); cv.width=T; cv.height=T; const x=cv.getContext("2d"); x.drawImage(IMG.cliff,c*T,r*T,T,T,0,0,T,T);
    b.appendChild(cv); b.onclick=()=>{ cliffPick=[c,r]; brush="cliff"; renderBrushes(); renderCliff(); };
    pal.appendChild(b);
  }
  const ctl=document.createElement("div"); ctl.className="row"; p.appendChild(ctl);
  const hs=document.createElement("select"); hs.id="wallH"; [2,3].forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=`壁${n}マス`; hs.appendChild(o); });
  const pb=document.createElement("button"); pb.type="button"; pb.textContent="見本の台地を置く";
  pb.onclick=()=>{ for(const k of Object.keys(cliffs)){ const [x,y]=k.split(",").map(Number); if(x>=9&&x<=14&&y>=1&&y<=8) delete cliffs[k]; } placePlateau(9,1,5,3,+hs.value); saveStore(); };
  const cb=document.createElement("button"); cb.type="button"; cb.textContent="崖を全部消す"; cb.onclick=()=>{ cliffs={}; saveStore(); };
  const fb=document.createElement("label"); fb.className="filebtn"; fb.textContent="崖の絵を読み込む";
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/png,image/*"; inp.id="file-cliff"; fb.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=async()=>{ try{ IMG.cliff=await loadImage(fr.result); cliffCustom=fr.result; saveStore(); renderCliff(); }catch(e){} }; fr.readAsDataURL(f); inp.value=""; };
  ctl.append(hs,pb,cb,fb);
  if(cliffCustom){ const rb=document.createElement("button"); rb.type="button"; rb.textContent="仮の崖に戻す"; rb.onclick=async()=>{ cliffCustom=null; IMG.cliff=await loadImage(makeCliffSheet()); saveStore(); renderCliff(); }; ctl.appendChild(rb); }
  add("p",`<span class="note">いまは${cliffCustom?"読み込んだ崖の絵":"四角と線だけの仮の崖"}です。壁を2マスにするか3マスにするかは、「見本の台地を置く」で両方置いて、主人公と並べて比べてください（スターデューバレーは壁3マス＋ふち1マス）。</span>`);
  add("h3","四角い崖の11枚（並びの案）");
  add("p","横3×縦4の並びにすると、このページでそのまま試せます。真ん中の上（崖の上の面）は草のタイルを使うので描かなくてよい。");
  const gl=document.createElement("div"); gl.className="slotgrid"; p.appendChild(gl);
  CLIFF_PART.forEach((n,i)=>{ if(i===4) return; const s=document.createElement("div"); s.className="slot"; const cv=document.createElement("canvas"); cv.width=T; cv.height=T; cv.style.width="32px"; cv.style.height="32px"; cv.style.flex="none"; cv.getContext("2d").drawImage(IMG.cliff,(i%3)*T,Math.floor(i/3)*T,T,T,0,0,T,T); const d=document.createElement("div"); d.innerHTML=`<b>${n}</b>${i<9?"上の面のへり":"正面の壁。高さの分だけ縦に重ねる"}`; s.append(cv,d); gl.appendChild(s); });
  add("ul",`<li>端（かど）は45度くらいの斜めでよい。</li><li>階段4枚と手前の坂4枚は、ebi さんの見本に合わせて描き、同じシートの下に並べれば、ここで選んで置けます。</li><li>高さは1種類にそろえる。</li>`);
}

// ---------- タブ ----------
function showTab(name){
  for(const n of ["sheets","guide","cliff"]){ document.getElementById("tab-"+n).setAttribute("aria-selected",String(n===name)); document.getElementById("pane-"+n).hidden = n!==name; }
  try{ localStorage.setItem(STORE_KEY+"-tab",name); }catch(e){}
}
for(const n of ["sheets","guide","cliff"]) document.getElementById("tab-"+n).onclick=()=>showTab(n);

// ---------- はじめ ----------
(async()=>{
  const st=loadStore();
  IMG.grass=await loadImage(ASSETS.grass); IMG.tuft=await loadImage(ASSETS.tuft);
  IMG.player=await loadImage(ASSETS.player); IMG.shadow=await loadImage(ASSETS.shadow);
  for(const t of TERRAINS){
    const saved=st&&st.sheets&&st.sheets[t.key];
    if(saved&&saved.src){ t.custom=saved.src; if(t.anim&&saved.frames){ t.anim.frames=saved.frames; t.anim.fps=saved.fps||t.anim.fps; } }
    try{ await setSheet(t,t.custom||ASSETS[t.key]); }catch(e){ t.custom=null; await setSheet(t,ASSETS[t.key]); }
  }
  cliffCustom = st&&st.cliffSheet || null;
  try{ IMG.cliff=await loadImage(cliffCustom||makeCliffSheet()); }catch(e){ cliffCustom=null; IMG.cliff=await loadImage(makeCliffSheet()); }
  if(st&&st.corners&&st.corners.length===corners.length){ corners.set(st.corners); cliffs=st.cliffs||{}; } else sampleMap();
  if(st&&st.zoom) zoomSel.value=st.zoom;
  zoomSel.onchange=()=>{ applyZoom(); saveStore(); };
  applyZoom(); renderBrushes(); renderSheets(); renderGuide(); renderCliff();
  let tab="sheets"; try{ tab=localStorage.getItem(STORE_KEY+"-tab")||"sheets"; }catch(e){} showTab(tab);
  document.getElementById("btnSample").onclick=()=>{ sampleMap(); saveStore(); setTimeout(updateSheetMarks,50); };
  document.getElementById("btnClear").onclick=()=>{ corners.fill(GRASS); cliffs={}; saveStore(); setTimeout(updateSheetMarks,50); };
  loop(); setTimeout(updateSheetMarks,100);
})();
